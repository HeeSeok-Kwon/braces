name: Braces regression tests

on:
  push:
    branches:
      - fix/iterative-ast-traversal
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run project tests
        run: npm test
      - name: Install published baseline
        run: npm install --prefix "$RUNNER_TEMP/braces-baseline" --no-audit --no-fund braces@3.0.3
      - name: Compare with published 3.0.3
        env:
          BRACES_BASELINE_PATH: ${{ runner.temp }}/braces-baseline/node_modules/braces
        run: node test/differential-3.0.3.js
